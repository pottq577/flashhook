# 사용 전 .env 파일 생성 필요:
# cp .env.example .env
# 그리고 .env 파일의 값들을 실제 값으로 수정하세요.

services:
  redis:
    image: redis:7.4.0-alpine
    container_name: flashhook-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    restart: always
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?set REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./FH_backend
      dockerfile: Dockerfile
    container_name: flashhook-backend
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9090:9090"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:9090/actuator/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - MONGODB_URI=${MONGODB_URI}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?set REDIS_PASSWORD}

  prometheus:
    image: prom/prometheus:v2.53.1
    container_name: flashhook-prometheus
    restart: always
    volumes:
      - ./FH_backend/docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9091:9090"
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:11.1.0
    container_name: flashhook-grafana
    restart: always
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  redis-data:
  prometheus_data:
  grafana_data:
