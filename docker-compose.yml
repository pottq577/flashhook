
services:
  mongodb:
    image: mongo:7.0.14
    container_name: flashhook-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: always

  redis:
    image: redis:7.4.0-alpine
    container_name: flashhook-redis
    ports:
      - "6379:6379"
    restart: always

volumes:
  mongo_data:
