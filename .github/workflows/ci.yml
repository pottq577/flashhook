name: FlashHook CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        persist-credentials: false

    - name: Start MongoDB and Redis
      run: docker compose up -d mongodb redis

    - name: Set up JDK 21
      uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Build Backend (Run Unit Tests)
      working-directory: ./FH_backend
      run: |
        chmod +x gradlew
        ./gradlew build

    - name: Start Backend Server
      working-directory: ./FH_backend
      run: |
        ./gradlew bootJar
        nohup java -jar $(find build/libs -name "*.jar" ! -name "*-plain.jar" | head -n 1) > backend.log 2>&1 &
        BACKEND_PID=$!
        echo "Backend started with PID: $BACKEND_PID"
        # Wait for backend to be ready on port 8080
        timeout 120 bash -c 'while ! curl -fsS http://localhost:8080/api/actuator/health > /dev/null; do sleep 2; done' || {
          echo "Backend health check failed"
          tail -n 200 backend.log || true
          exit 1
        }

    - name: Set up Node.js 22
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: ./FH_frontend/package-lock.json

    - name: Install Frontend Dependencies
      working-directory: ./FH_frontend
      run: npm ci

    - name: Run Frontend Linter
      working-directory: ./FH_frontend
      run: npm run lint

    - name: Cache Playwright Browsers
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}

    - name: Install Playwright Browsers
      working-directory: ./FH_frontend
      run: npx playwright install chromium --with-deps

    - name: Run E2E Tests
      working-directory: ./FH_frontend
      run: npm run test:e2e
      env:
        CI: true

    - name: Upload Playwright Report
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: playwright-report
        path: FH_frontend/e2e/playwright-report/
        retention-days: 14
