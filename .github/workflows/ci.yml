name: FlashHook CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Start MongoDB and Redis
      run: docker compose up -d mongodb redis

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Build Backend (Run Unit Tests)
      working-directory: ./FH_backend
      run: |
        chmod +x gradlew
        ./gradlew build

    - name: Start Backend Server
      working-directory: ./FH_backend
      run: |
        ./gradlew bootRun > backend.log 2>&1 &
        # Wait for backend to be ready on port 8080
        timeout 120 bash -c 'while ! curl -s http://localhost:8080/api/health > /dev/null; do sleep 2; done' || echo "Backend started or timed out"

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: ./FH_frontend/package-lock.json

    - name: Install Frontend Dependencies
      working-directory: ./FH_frontend
      run: npm ci

    - name: Run Frontend Linter
      working-directory: ./FH_frontend
      run: npm run lint

    - name: Install Playwright Browsers
      working-directory: ./FH_frontend
      run: npx playwright install --with-deps

    - name: Run E2E Tests
      working-directory: ./FH_frontend
      run: npm run test:e2e
      env:
        CI: true

    - name: Upload Playwright Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: FH_frontend/e2e/playwright-report/
        retention-days: 14
