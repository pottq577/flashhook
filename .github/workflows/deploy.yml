name: Deploy Backend to OCI

on:
  push:
    branches: ["main"]

concurrency:
  group: deploy-oci
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Execute Remote SSH Commands and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USERNAME }}
          key: ${{ secrets.OCI_SSH_KEY }}
          script: |
            set -euo pipefail
            mkdir -p ~/flashhook
            cd ~/flashhook

            if [ ! -d ".git" ]; then
              git clone https://github.com/hyun2y00/flashhook.git .
            else
              git fetch --all
              git reset --hard origin/main
            fi

            umask 077
            cat <<EOF > .env
            SPRING_PROFILES_ACTIVE=${{ secrets.SPRING_PROFILES_ACTIVE }}
            FLASHHOOK_SECRET_KEY=${{ secrets.FLASHHOOK_SECRET_KEY }}
            FLASHHOOK_ADMIN_SECRET_KEY=${{ secrets.FLASHHOOK_ADMIN_SECRET_KEY }}
            MONGODB_URI=${{ secrets.MONGODB_URI }}
            REDIS_HOST=${{ secrets.REDIS_HOST }}
            REDIS_PORT=${{ secrets.REDIS_PORT }}
            REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
            GRAFANA_ADMIN_PASSWORD=${{ secrets.GRAFANA_ADMIN_PASSWORD }}
            BASE_MGMT=${{ secrets.BASE_MGMT }}
            EOF

            chmod 600 .env

            sudo docker compose -f docker-compose.prod.yml up --build -d
