# 프로덕션 환경 설정 (⚠️ git 추적 제외 — .gitignore에 등록됨)
# 배포 시 이 파일을 서버에 직접 배치하거나, 환경변수로 오버라이드
spring:
  data:
    mongodb:
      uri: ${MONGODB_URI}
      auto-index-creation: false

    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}

flashhook:
  base-url: https://api.flashhook.site
  fe-url: https://flashhook.site

management:
  server:
    address: 0.0.0.0
