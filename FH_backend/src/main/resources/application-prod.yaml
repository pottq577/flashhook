# 프로덕션 환경 템플릿 파일 (환경변수로 주입받는 구조이므로 git에서 추적함)
# 배포 시 런타임 환경변수를 통해 실제 시크릿 값을 오버라이드합니다.
spring:
  mongodb:
    uri: ${MONGODB_URI}
    database: flashhook
    auto-index-creation: false
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}

flashhook:
  base-url: https://api.flashhook.site
  fe-url: https://flashhook.site

management:
  server:
    address: 0.0.0.0
