# 프로덕션 배포 시 참조할 설정 템플릿입니다. (이 파일은 Git에 추적됩니다)
# 실제 배포 환경에서는 이 파일을 복사하여 application-prod.yaml 로 이름을 바꾸거나,
# 여기에 명시된 환경변수들을 서버(OS) 환경변수로 직접 주입해 주어야 합니다.

spring:
  data:
    mongodb:
      # 실제 MongoDB 접속 URI를 환경변수 MONGODB_URI 로 주입받습니다.
      uri: ${MONGODB_URI}
      auto-index-creation: false

    redis:
      # 실제 Redis 접속 정보를 환경변수로 주입받습니다.
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}

flashhook:
  base-url: https://api.flashhook.site
  fe-url: https://flashhook.site
